<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c1830">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Parto TV">
<title>Parto TV</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l5 5"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.9L12 16.9l-5.2 2.8 1-5.9L3.5 9.7l5.9-.8z"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3.5 2"/></symbol>
  <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h9M19 7h1M4 17h1M11 17h9"/><circle cx="16" cy="7" r="2.2"/><circle cx="8" cy="17" r="2.2"/></symbol>
  <symbol id="i-pulse" viewBox="0 0 24 24"><path d="M3 12h4l2.5-6 4 12 2.5-6H21"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
  <symbol id="i-full" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></symbol>
  <symbol id="i-pip" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><rect x="12" y="11" width="6" height="4" rx="1" style="fill:currentColor"/></symbol>
  <symbol id="i-vol" viewBox="0 0 24 24"><path d="M4 9.5v5h3.5l4.5 4v-13l-4.5 4z" style="fill:currentColor"/><path d="M15.5 9a4 4 0 010 6M18 6.5a8 8 0 010 11"/></symbol>
  <symbol id="i-mute" viewBox="0 0 24 24"><path d="M4 9.5v5h3.5l4.5 4v-13l-4.5 4z" style="fill:currentColor"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 12a8 8 0 11-2.3-5.7M20 4v5h-5"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
  <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a4 4 0 005.7 0l3-3a4 4 0 00-5.7-5.7l-1 1M14 10a4 4 0 00-5.7 0l-3 3a4 4 0 005.7 5.7l1-1"/></symbol>
  <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c3.2 3 3.2 14 0 17M12 3.5c-3.2 3-3.2 14 0 17"/></symbol>
  <symbol id="i-tag" viewBox="0 0 24 24"><path d="M4 4h8l8 8-8 8-8-8z"/><circle cx="8.5" cy="8.5" r="1"/></symbol>
  <symbol id="i-stack" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="6" rx="1.5"/><rect x="4" y="14" width="16" height="6" rx="1.5"/></symbol>
  <symbol id="i-all" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5M12 8v.01"/></symbol>
</svg>

<div id="app">
  <header id="top">
    <div class="brand"><img src="favicon.svg" alt="" width="34" height="34"><b id="brandName">Parto</b></div>
    <label class="search" id="searchBox">
      <svg class="ic"><use href="#i-search" xlink:href="#i-search"/></svg>
      <input id="q" type="search" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" data-i18n-ph="search">
    </label>
    <div class="seg" id="statusSeg" role="group">
      <button type="button" data-s="on" data-i18n="fOnline"></button>
      <button type="button" data-s="all" data-i18n="fAll"></button>
      <button type="button" data-s="off" data-i18n="fOffline"></button>
    </div>
    <button type="button" class="tbtn" id="sortBtn"></button>
    <button type="button" class="tbtn ico" id="btnAnalyze" data-i18n-title="analyze"><svg class="ic"><use href="#i-pulse" xlink:href="#i-pulse"/></svg></button>
    <button type="button" class="tbtn ico" id="btnSettings" data-i18n-title="settings"><svg class="ic"><use href="#i-sliders" xlink:href="#i-sliders"/></svg></button>
    <div class="net" id="net" title=""><span class="sg l0" id="netBars"><i></i><i></i><i></i><i></i></span><em id="netMs">--</em></div>
  </header>
  <div id="scan"><i id="scanFill"></i><span id="scanText"></span></div>
  <div id="body">
    <nav id="side" aria-label="categories"></nav>
    <main id="main">
      <div id="head">
        <h1 id="title"></h1>
        <span id="count"></span>
        <button type="button" id="resume" class="tbtn" hidden></button>
      </div>
      <div id="list"><div id="rows" role="listbox"></div></div>
      <div id="empty" hidden></div>
    </main>
  </div>
</div>

<div id="player" hidden>
  <video id="pv" playsinline webkit-playsinline preload="auto"></video>
  <div id="pspin" class="pspin" hidden><i></i><i></i><i></i></div>
  <div id="ptop" class="ptop">
    <button type="button" class="pbtn" id="pBack" data-i18n-title="close"><svg class="ic"><use href="#i-back" xlink:href="#i-back"/></svg></button>
    <span id="ptopName" dir="auto"></span>
  </div>
  <div id="pstat" class="pstat" hidden></div>
  <div id="pnum" class="pnum" hidden></div>
  <div id="ptoast" class="ptoast" hidden></div>
  <div id="perr" class="perr" hidden>
    <div class="perr-box">
      <div class="perr-t" data-i18n="noSignal"></div>
      <p data-i18n="noSignalHint"></p>
      <div class="perr-a">
        <button type="button" id="eRetry" class="tbtn pri" data-i18n="retry"></button>
        <button type="button" id="eDirect" class="tbtn" data-i18n="direct"></button>
        <button type="button" id="eNext" class="tbtn" data-i18n="nextCh"></button>
      </div>
    </div>
  </div>
  <div id="posd" class="posd"></div>
  <div id="pbar" class="pbar">
    <button type="button" class="pbtn" id="bPrev"><svg class="ic"><use href="#i-down" xlink:href="#i-down"/></svg></button>
    <button type="button" class="pbtn" id="bNext"><svg class="ic"><use href="#i-up" xlink:href="#i-up"/></svg></button>
    <button type="button" class="pbtn" id="bList"><svg class="ic"><use href="#i-list" xlink:href="#i-list"/></svg></button>
    <button type="button" class="pbtn" id="bFav"><svg class="ic"><use href="#i-star" xlink:href="#i-star"/></svg></button>
    <button type="button" class="pbtn" id="bQual"><svg class="ic"><use href="#i-sliders" xlink:href="#i-sliders"/></svg></button>
    <button type="button" class="pbtn" id="bInfo"><svg class="ic"><use href="#i-info" xlink:href="#i-info"/></svg></button>
    <button type="button" class="pbtn" id="bDirect"><svg class="ic"><use href="#i-link" xlink:href="#i-link"/></svg></button>
    <button type="button" class="pbtn" id="bPip"><svg class="ic"><use href="#i-pip" xlink:href="#i-pip"/></svg></button>
    <button type="button" class="pbtn" id="bMute"><svg class="ic"><use href="#i-vol" xlink:href="#i-vol"/></svg></button>
    <button type="button" class="pbtn" id="bFull"><svg class="ic"><use href="#i-full" xlink:href="#i-full"/></svg></button>
  </div>
  <aside id="pdrawer" class="pdrawer" hidden></aside>
  <div id="pq" class="pq" hidden></div>
</div>

<div id="modal" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<script src="vendor/hls.min.js"></script>
<script src="app.js"></script>
</body>
</html>
