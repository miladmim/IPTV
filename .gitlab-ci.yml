# GitLab Pages Configuration for Parto TV
pages:
  stage: deploy
  image: alpine:latest
  script:
    - mkdir .public
    - cp -r * .public/ 2>/dev/null || true
    - cp .nojekyll .public/ 2>/dev/null || true
    - rm -rf .public/public
    - mv .public public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
